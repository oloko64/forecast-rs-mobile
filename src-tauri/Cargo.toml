[package]
name = "forecast-mobile"
version = "0.4.0"
description = "Hourly weather forecast powered by Open-Meteo"
authors = ["OLoKo64"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519).
name = "forecast_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
# MET Norway returns UTC times: convert them to the location's local time.
chrono-tz = "0.10"
iana-time-zone = "0.1"
tokio = { version = "1", features = ["time", "macros"] }
# TLS: rustls with the pure-Rust-friendly `ring` backend and bundled Mozilla roots.
# No OpenSSL, no aws-lc (CMake), no platform verifier (needs JNI on Android).
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "http2",
    "charset",
    "json",
    "query",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"

# GPS is only available on Android/iOS.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-geolocation = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
