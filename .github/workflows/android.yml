# Builds a signed arm64 APK on every push to main (merged PRs included) and
# publishes it as the rolling "latest" pre-release:
#   https://github.com/<owner>/<repo>/releases/download/latest/forecast-arm64.apk
#
# Needs four repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       key password (same as the keystore one for PKCS12)

name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes a build still running.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # to replace the "latest" release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$KS" ] || missing+=(ANDROID_KEYSTORE_BASE64)
          [ -n "$KS_PASS" ] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [ -n "$ALIAS" ] || missing+=(ANDROID_KEY_ALIAS)
          [ -n "$KEY_PASS" ] || missing+=(ANDROID_KEY_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]} (see the top of this workflow)"
            exit 1
          fi

      # ---- Toolchains -------------------------------------------------------
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            src-tauri/gen/android/**/*.gradle*
            src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Gradle's Rust step runs `cargo tauri`: use the prebuilt CLI.
      - uses: cargo-bins/cargo-binstall@v1.28.0
      - name: Tauri CLI
        run: cargo binstall tauri-cli@2 --no-confirm --locked

      # Desktop libraries, only needed to compile and run the Rust tests on Linux.
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Frontend dependencies
        run: bun install --frozen-lockfile

      # ---- Checks: a failure stops the release -------------------------------
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Svelte check
        run: bun run check

      # ---- Build, sign, publish ----------------------------------------------
      - name: Build APK
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "Using NDK $NDK_HOME"
          cargo tauri android build --apk --target aarch64 --ci

      - name: Sign APK
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          unsigned=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$bt/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS \
            --ks-key-alias "$ALIAS" --key-pass env:KEY_PASS \
            --out forecast-arm64.apk "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" verify --print-certs forecast-arm64.apk | head -3
          rm -f "$RUNNER_TEMP/release.jks"
          echo "VERSION=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: forecast-${{ env.VERSION }}-arm64
          path: forecast-arm64.apk
          retention-days: 30

      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest forecast-arm64.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build · v$VERSION" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC'). Android 7.0+, arm64.

          Install \`forecast-arm64.apk\` on your phone; it updates over earlier builds from this workflow."
